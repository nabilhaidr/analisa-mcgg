<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #1c2230; --muted: #5d6879; --line: #e2e6ed;
  --accent: #3366e6; --chip: #eef1f6; --srv: #b4530a; --srv-bg: #fff4e5;
  --c1: #7d8798; --c2: #2b9a61; --c3: #2a77cf; --c4: #8d55d9; --c5: #d48a12; --c7: #d93d72;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --card: #161b24; --text: #e6ebf2; --muted: #98a3b4; --line: #283040;
    --accent: #7ea1ff; --chip: #212837; --srv: #ffb454; --srv-bg: #33270f;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --card: #161b24; --text: #e6ebf2; --muted: #98a3b4; --line: #283040;
  --accent: #7ea1ff; --chip: #212837; --srv: #ffb454; --srv-bg: #33270f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 13px; }
nav { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
nav .wrap { max-width: 1200px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
button.tab { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; }
button.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
main { max-width: 1200px; margin: 0 auto; padding: 12px 16px 40px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; align-items: center; }
input[type=search], select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type=search] { flex: 1 1 220px; min-width: 0; }
.chip { display: inline-block; border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { outline: 2px solid var(--accent); }
.chip.static { cursor: default; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.card h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cost { color: #fff; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 7px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.stats { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
.stats th, .stats td { border-bottom: 1px solid var(--line); padding: 3px 4px; text-align: right; white-space: nowrap; }
.stats th:first-child, .stats td:first-child { text-align: left; }
.stats-wrap { overflow-x: auto; }
.skill { margin-top: 10px; }
.skill b { display: block; }
.desc { white-space: pre-line; font-size: 14px; }
.muted { color: var(--muted); }
.tiers { margin: 8px 0 0; padding: 0; list-style: none; }
.tiers li { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.tiers .n { flex: 0 0 auto; font-weight: 700; min-width: 26px; text-align: center; background: var(--chip); border-radius: 6px; height: fit-content; }
h2 { font-size: 18px; margin: 22px 0 10px; }
.count { color: var(--muted); font-weight: 400; font-size: 14px; }
.hidden { display: none !important; }
.srv { color: var(--srv); font-weight: 700; }
.srvnote { margin-top: 6px; padding: 4px 8px; border-left: 3px solid var(--srv); background: var(--srv-bg); font-size: 13px; border-radius: 4px; }
.chip.srvchip { border-color: var(--srv); color: var(--srv); }
.list { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.list th, .list td { text-align: left; vertical-align: top; padding: 5px 6px; border-bottom: 1px solid var(--line); }
.theme { margin-left: auto; }
.list .num { white-space: nowrap; font-variant-numeric: tabular-nums; }
.list.store { min-width: 720px; }
.datanote { margin-top: 4px; font-size: 13px; color: var(--muted); font-style: italic; }
.ico { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; flex: none; }
.ico.round { border-radius: 50%; }
.ico.art { width: 44px; height: 60px; border-radius: 6px; }
.ico.sm { width: 24px; height: 24px; border-radius: 5px; vertical-align: -7px; margin-right: 6px; }
.ico.xs { width: 18px; height: 18px; border-radius: 50%; vertical-align: -4px; margin-right: 4px; }
.kw { margin-top: 6px; padding: 4px 8px; border-left: 3px solid var(--accent); background: var(--chip); font-size: 13px; border-radius: 4px; }
.kw .desc { font-size: 13px; }
.gpnote { margin-top: 8px; padding: 4px 8px; border-left: 3px solid var(--c2); background: var(--chip); font-size: 13px; border-radius: 4px; }
.gpnote .desc, .gpnote .muted { font-size: 12.5px; }
.unverified { margin: 0 0 10px; padding: 4px 8px; border-left: 3px solid var(--muted); background: var(--chip); font-size: 13px; border-radius: 4px; }
a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
</header>
<nav><div class="wrap">
  <button class="tab" data-tab="heroes" aria-selected="true">Hero</button>
  <button class="tab" data-tab="synergies" aria-selected="false">Sinergi</button>
  <button class="tab" data-tab="commanders" aria-selected="false">Commander</button>
  <button class="tab" data-tab="cards" aria-selected="false">Go Go Card</button>
  <button class="tab" data-tab="equipment" aria-selected="false">Equipment</button>
  <button class="tab" data-tab="info" aria-selected="false">Info Season</button>
  <button class="tab" data-tab="book" aria-selected="false">Ensiklopedia</button>
  <button class="tab" data-tab="server" aria-selected="false">Patch Server</button>
  <button class="tab theme" id="theme" title="Ganti tema">◐</button>
</div></nav>
<main>
  <section id="heroes">
    <div class="controls">
      <input type="search" id="q" placeholder="Cari hero, skill, atau teks…" aria-label="Cari hero">
      <select id="syn" aria-label="Filter sinergi"><option value="">Semua sinergi</option></select>
      <span id="costs"></span>
      <span class="muted" id="hcount"></span>
    </div>
    <div class="grid" id="hero-grid"></div>
  </section>
  <section id="synergies" class="hidden"></section>
  <section id="commanders" class="hidden">
    <div class="controls"><span id="cmd-cats"></span><span class="muted" id="ccount"></span></div>
    <div class="grid" id="cmd-grid"></div>
  </section>
  <section id="cards" class="hidden">
    <div class="controls">
      <input type="search" id="card-q" placeholder="Cari Go Go Card…" aria-label="Cari Go Go Card">
      <span id="card-tiers"></span>
      <button class="chip" id="card-inactive" aria-pressed="false" title="Kartu di tabel dasar yang tidak muncul in-game season ini">Tampilkan nonaktif</button>
      <span class="muted" id="card-count"></span>
    </div>
    <p class="muted">Hanya kartu aktif yang tampil in-game. "Putaran" = putaran Go Go Card tempat kartu bisa muncul; Kartu Power hanya di putaran 1 (babak I-2).</p>
    <div class="grid" id="card-grid"></div>
  </section>
  <section id="equipment" class="hidden">
    <div class="controls">
      <input type="search" id="eq-q" placeholder="Cari equipment…" aria-label="Cari equipment">
      <span id="eq-cats"></span>
      <button class="chip" id="eq-inactive" aria-pressed="false">Tampilkan nonaktif</button>
      <span class="muted" id="eq-count"></span>
    </div>
    <div class="grid" id="eq-grid"></div>
  </section>
  <section id="info" class="hidden"></section>
  <section id="server" class="hidden"></section>
  <section id="book" class="hidden">
    <div class="controls"><span id="book-tabs"></span></div>
    <div id="book-body"></div>
  </section>
</main>
<script type="application/json" id="data">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const COST = { 1: "--c1", 2: "--c2", 3: "--c3", 4: "--c4", 5: "--c5" };
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? n.className = v : n.setAttribute(k, v);
  for (const k of kids) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
};
// game icons extracted by mc_images.py into img/<Atlas>/ next to this page ("icon" is null when the game has none)
const img = (src, cls = "") => src ? el("img", { src, alt: "", class: ("ico " + cls).trim(), loading: "lazy" }) : "";
const costBadge = c => { const b = el("span", { class: "cost" }, c + " Gold"); b.style.background = `var(${COST[c] || "--c7"})`; return b; };

const INFO = D.info || {}, CARDS = D.cards || [], EQUIP = D.equipment || [], STORE = D.special_store || null;
document.getElementById("title").textContent = `Magic Chess: Go Go: Season ${D.season}${INFO.name ? ": " + INFO.name : ""}`;
const faksi = D.synergies.filter(s => s.type === "Faksi").length, role = D.synergies.length - faksi;
document.getElementById("meta").textContent = [
  `Versi game ${D.game_version}`, D.rank ? `Rank Season ${D.rank.id}: ${D.rank.start} s/d ${D.rank.end}` : null,
  `${D.heroes.length} hero · ${faksi} faksi · ${role} role · ${D.commanders.length} commander · ${CARDS.filter(c => c.active !== false).length} Go Go Card aktif · ${EQUIP.filter(e => e.active !== false).length} equipment aktif`,
  "a/b/c = nilai ★1/★2/★3 · (dinamis) = dihitung saat battle",
  (D.server_patches || []).length ? "angka/catatan oranye = Patch Note yang diterapkan server (bukan file game), lihat tab Patch Server"
                                  : "angka hotfix server tidak ada di file lokal",
].filter(Boolean).join("  •  ");
// chip-group filter helper: one active value or null
function chipFilter(boxId, values, onChange) {
  const box = document.getElementById(boxId);
  let active = null;
  values.forEach(v => {
    const chip = el("button", { class: "chip", "aria-pressed": "false" }, v);
    chip.onclick = () => {
      active = active === v ? null : v;
      box.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === chip && active === v));
      onChange(active);
    };
    box.append(chip, " ");
  });
}
// server-applied patch notes (server_patch.json): orange note under the item
const serverNotes = notes => (notes || []).map(n => el("div", { class: "srvnote" }, `Patch ${n.patch} (server): ${n.text}`));
function skillBlock(s, title, notes) {
  // details = tooltip of an underlined keyword in the skill text (SkillKeyWords_MC), e.g. Alucard's "Hadiah"
  const kids = [el("b", {}, img(s.icon, "sm"), title || s.name), el("div", { class: "desc" }, s.description_server || s.description),
    ...(s.details || []).map(k => el("div", { class: "kw" }, el("b", {}, `Detail "${k.keyword}"`), el("div", { class: "desc" }, k.text))),
    ...serverNotes(notes)];
  const attrs = s.attributes_server || s.attributes;  // attributes_server = values changed by a server patch
  if (attrs && attrs.length) {
    const n = attrs[0].values.length, t = el("table", { class: "stats" });
    t.append(el("tr", {}, el("th", {}, "Atribut Skill"), ...Array.from({ length: n }, (_, i) => el("th", {}, "★" + (i + 1)))));
    attrs.forEach((a, r) => t.append(el("tr", {}, el("td", {}, a.label), ...a.values.map((v, i) => {
      const file = s.attributes[r].values[i];
      return v !== file ? el("td", { class: "srv", title: `Patch server; file game: ${file}` }, v) : el("td", {}, v);
    }))));
    kids.push(el("div", { class: "stats-wrap" }, t));
  }
  return el("div", { class: "skill" }, ...kids);
}

// tabs + theme
document.querySelectorAll("button.tab[data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll("button.tab[data-tab]").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("button.tab[data-tab]").forEach(x => document.getElementById(x.dataset.tab).classList.toggle("hidden", x !== b));
  window.scrollTo({ top: 0 });
});
document.getElementById("theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

// heroes
const SYN_ICON = Object.fromEntries(D.synergies.map(s => [s.name, s.icon]));
const HERO_ICON = Object.fromEntries(D.heroes.map(h => [h.name, h.icon]));
const state = { q: "", syn: "", cost: null };
const synSel = document.getElementById("syn");
for (const type of ["Faksi", "Role"]) {
  const g = el("optgroup", { label: type });
  D.synergies.filter(s => s.type === type).forEach(s => g.append(el("option", { value: s.name }, `${s.name} (${s.heroes.length})`)));
  synSel.append(g);
}
synSel.onchange = () => { state.syn = synSel.value; renderHeroes(); };
document.getElementById("q").oninput = e => { state.q = e.target.value.toLowerCase(); renderHeroes(); };
const costBox = document.getElementById("costs");
[...new Set(D.heroes.map(h => h.cost))].sort((a, b) => a - b).forEach(c => {
  const chip = el("button", { class: "chip", "aria-pressed": "false" }, c + " Gold");
  chip.onclick = () => {
    state.cost = state.cost === c ? null : c;
    costBox.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === chip && state.cost === c));
    renderHeroes();
  };
  costBox.append(chip, " ");
});
function heroCard(h) {
  const labels = Object.keys(Object.values(h.stats)[0] || {});
  const table = el("table", { class: "stats" });
  table.append(el("tr", {}, el("th", {}, "★"), ...labels.map(l => el("th", {}, l))));
  for (const [star, st] of Object.entries(h.stats)) table.append(el("tr", {}, el("td", {}, star), ...labels.map(l => {
    const sv = ((h.stats_server || {})[star] || {})[l];
    return sv ? el("td", { class: "srv", title: `Patch server; file game: ${st[l]}` }, sv) : el("td", {}, st[l]);
  })));
  const pills = el("div", { class: "pills" }, ...h.synergies.map(s => {
    const p = el("button", { class: "chip", title: "Filter sinergi ini" }, img(SYN_ICON[s], "xs"), s);
    p.onclick = () => { synSel.value = s; state.syn = s; renderHeroes(); };
    return p;
  }));
  const extra = h.enhanced ? [skillBlock(h.enhanced.skill, `Versi diperkuat (${h.enhanced.card}): ${h.enhanced.skill.name}`)] : [];
  return el("article", { class: "card" },
    el("h3", {}, img(h.icon, "round"), h.name, costBadge(h.cost),
       h.summoned ? el("span", { class: "chip", title: "Tidak dijual di Toko; dipanggil oleh sinergi" }, "Hero panggilan") : ""),
    pills, el("div", { class: "stats-wrap" }, table),
    ...serverNotes(h.server), ...h.skills.map(s => skillBlock(s, null, s.server)), ...extra);
}
function renderHeroes() {
  const list = D.heroes.filter(h =>
    (!state.syn || h.synergies.includes(state.syn)) && (state.cost === null || h.cost === state.cost) &&
    (!state.q || JSON.stringify([h.name, h.synergies, h.skills]).toLowerCase().includes(state.q)));
  document.getElementById("hero-grid").replaceChildren(...list.map(heroCard));
  document.getElementById("hcount").textContent = `${list.length} hero`;
}
renderHeroes();

// synergies
const heroCost = Object.fromEntries(D.heroes.map(h => [h.name, h.cost]));
const summoned = new Set(D.heroes.filter(h => h.summoned).map(h => h.name));
const synBox = document.getElementById("synergies");
for (const type of ["Faksi", "Role"]) {
  const list = D.synergies.filter(s => s.type === type);
  synBox.append(el("h2", {}, type, " ", el("span", { class: "count" }, `(${list.length})`)));
  synBox.append(el("div", { class: "grid" }, ...list.map(s => el("article", { class: "card" },
    el("h3", {}, img(s.icon), s.name),
    el("div", { class: "pills" }, ...s.heroes.map(n => {
      const p = el("span", { class: "chip" }, img(HERO_ICON[n], "xs"), summoned.has(n) ? n + " *" : n);
      p.style.borderColor = `var(${COST[heroCost[n]] || "--c7"})`;
      if (summoned.has(n)) { p.style.borderStyle = "dashed"; p.title = "Hero panggilan (tidak dijual di Toko)"; }
      return p;
    })),
    s.explain ? el("div", { class: "desc muted" }, s.explain) : "",
    el("ul", { class: "tiers" }, ...s.tiers.map(t => el("li", {}, el("span", { class: "n" }, t.count), el("span", { class: "desc" }, t.effect)))),
    ...serverNotes(s.server),
    STORE && STORE.synergy === s.name ? el("div", { class: "skill" }, el("a", { href: "#special-store" }, `Isi ${STORE.title} ↓`)) : ""))));
}
// Toko Spirit Sand (SpecialStore), below the synergy grids
if (STORE) {
  const t = el("table", { class: "list store" });
  t.append(el("tr", {}, ...["Item", "Harga", "Peluang (bobot)", "Batas beli", "Efek"].map(h => el("th", {}, h))));
  STORE.items.forEach(it => t.append(el("tr", {},
    el("td", {}, el("b", {}, it.name)),
    el("td", { class: "num" }, `${it.price} ${STORE.currency}`),
    el("td", { class: "num" }, `${it.chance}% (${it.weight})`),
    el("td", { class: "num" }, it.limit || "tanpa batas"),
    el("td", {}, el("div", { class: "desc" }, it.effect || it.description || "sesuai nama item"),
      it.pool.length ? el("div", { class: "desc muted" }, "Pilihan: " + it.pool.join(", ")) : "",
      ...it.notes.map(n => el("div", { class: "datanote" }, "Catatan data: " + n))))));
  synBox.append(el("h2", { id: "special-store" }, `${STORE.title} `, el("span", { class: "count" }, `(sinergi ${STORE.synergy} · ${STORE.items.length} item)`)),
    el("p", { class: "muted" }, `${STORE.currency_text} Batas simpan ${STORE.max_storage} ${STORE.currency}. ` +
      `Peluang = bobot item / total bobot (${STORE.total_weight}); jumlah slot dan aturan refresh toko tidak ada di tabel. ` +
      "Sumber: SpecialStore + MCSpecialCardPool, efek dari MCSkill/MCEffect."),
    STORE.verified ? "" : el("div", { class: "unverified" },"Belum terverifikasi: belum ada screenshot Toko Spirit Sand untuk dicocokkan dengan data ini."),
    el("div", { class: "card stats-wrap" }, t));
}

// commanders
function renderCommanders(cat) {
  const list = D.commanders.filter(c => !cat || c.category === cat);
  document.getElementById("cmd-grid").replaceChildren(...list.map(c => el("article", { class: "card" },
    el("h3", {}, img(c.icon, "round"), c.name, el("span", { class: "chip" }, c.category || "-")),
    ...c.skills.map(s => skillBlock(s.skill, `Lv ${s.from_level}+${s.type ? " · " + s.type : ""}: ${s.skill.name}`, s.server)),
    c.power_card ? el("div", { class: "skill" }, el("b", {}, `Kartu Power: ${c.power_card.name}`),
                      el("div", { class: "desc muted" }, c.power_card.description)) : "")));
  document.getElementById("ccount").textContent = `${list.length} commander`;
}
chipFilter("cmd-cats", [...new Set(D.commanders.map(c => c.category))].sort(), renderCommanders);
renderCommanders(null);

// go go cards
const cardState = { q: "", tier: null, inactive: false };
const isActive = c => c.active !== false;  // older exports have no "active" field
function renderCards() {
  const list = CARDS.filter(c => (cardState.inactive ? !isActive(c) : isActive(c)) &&
    (!cardState.tier || c.tier === cardState.tier) &&
    (!cardState.q || (c.name + " " + c.description).toLowerCase().includes(cardState.q)));
  document.getElementById("card-grid").replaceChildren(...list.map(c => el("article", { class: "card" },
    el("h3", {}, img(c.icon, "art"), c.name, el("span", { class: "chip" }, c.tier), c.season_only ? el("span", { class: "chip" }, "season ini") : "",
       !isActive(c) ? el("span", { class: "chip" }, "nonaktif") : "",
       c.removed_server ? el("span", { class: "chip srvchip" }, `dihapus (Patch ${c.removed_server}, server)`) : ""),
    c.rounds && c.rounds.length && c.tier !== "Power" ? el("div", { class: "muted" }, "Putaran " + c.rounds.join(", ")) : "",
    el("div", { class: "desc" }, c.description_server || c.description), ...serverNotes(c.server))));
  document.getElementById("card-count").textContent = `${list.length} kartu ${cardState.inactive ? "nonaktif" : "aktif"}`;
}
document.getElementById("card-q").oninput = e => { cardState.q = e.target.value.toLowerCase(); renderCards(); };
const inactiveBtn = document.getElementById("card-inactive");
inactiveBtn.classList.toggle("hidden", !CARDS.some(c => !isActive(c)));
inactiveBtn.onclick = () => {
  cardState.inactive = !cardState.inactive;
  inactiveBtn.setAttribute("aria-pressed", cardState.inactive);
  renderCards();
};
chipFilter("card-tiers", ["Power", "Spesial", "Oranye", "Ungu", "Biru"].filter(t => CARDS.some(c => c.tier === t)),
  t => { cardState.tier = t; renderCards(); });
renderCards();

// equipment
const eqState = { q: "", cat: null, inactive: false };
function renderEquipment() {
  const list = EQUIP.filter(e => (eqState.inactive ? !isActive(e) : isActive(e)) &&
    (!eqState.cat || e.category === eqState.cat) &&
    (!eqState.q || JSON.stringify(e.levels).toLowerCase().includes(eqState.q)));
  document.getElementById("eq-grid").replaceChildren(...list.map(e => el("article", { class: "card" },
    el("h3", {}, img(e.icon), e.levels[0].name, el("span", { class: "chip" }, e.category),
       !isActive(e) ? el("span", { class: "chip" }, "nonaktif") : ""),
    ...e.levels.map(lv => el("div", { class: "skill" },
      el("b", {}, lv.icon !== e.icon ? img(lv.icon, "sm") : "",
         (lv.upgraded ? "Ditingkatkan: " : "Dasar: ") + lv.name + (lv.summary ? ` (${lv.summary})` : "")),
      el("div", { class: "desc" }, [...lv.attributes, ...lv.unique.map(u => "Atribut Unik: " + u),
                                    ...lv.passives.map(p => "Pasif Unik - " + p)].join("\n") || "-"))),
    // catatan_gameplay.json: rules learned from playing, not in the game files
    ...(e.gameplay_notes || []).map(n => el("div", { class: "gpnote", title: n.source },
      el("b", {}, "Aturan dari pengalaman bermain"), el("div", { class: "desc" }, n.text),
      n.source ? el("div", { class: "muted" }, n.source) : "")))));
  document.getElementById("eq-count").textContent = `${list.length} equipment ${eqState.inactive ? "nonaktif" : "aktif"}`;
}
document.getElementById("eq-q").oninput = e => { eqState.q = e.target.value.toLowerCase(); renderEquipment(); };
const eqInactiveBtn = document.getElementById("eq-inactive");
eqInactiveBtn.classList.toggle("hidden", !EQUIP.some(e => !isActive(e)));
eqInactiveBtn.onclick = () => {
  eqState.inactive = !eqState.inactive;
  eqInactiveBtn.setAttribute("aria-pressed", eqState.inactive);
  renderEquipment();
};
chipFilter("eq-cats", [...new Set(EQUIP.map(e => e.category))].sort(), c => { eqState.cat = c; renderEquipment(); });
renderEquipment();

// season info
const infoBox = document.getElementById("info");
if (INFO.levels) {
  const t = el("table", { class: "stats" });
  t.append(el("tr", {}, ...["Level", "Biaya EXP", "Slot hero", "1 Gold", "2 Gold", "3 Gold", "4 Gold", "5 Gold"].map(h => el("th", {}, h))));
  INFO.levels.forEach(l => t.append(el("tr", {}, el("td", {}, l.level), el("td", {}, l.exp_cost), el("td", {}, l.hero_slots),
    ...l.shop_odds.map(x => el("td", {}, x + "%")))));
  infoBox.append(el("h2", {}, "Peluang toko per level Commander"), el("div", { class: "card stats-wrap" }, t));
}
if (INFO.pool_per_hero) {
  infoBox.append(el("h2", {}, "Jumlah salinan tiap hero di pool"),
    el("div", { class: "card" }, Object.entries(INFO.pool_per_hero).map(([k, v]) => `${k} Gold: ${v}`).join(" · ")));
}
// Go Go Box (MCRoundRandomEquip_S<n>): per round the number of orbs of each kind, the pools, and hero cost weights
const BOX = D.go_go_box;
if (BOX && BOX.rounds.length) {
  const EQ_BY_ID = Object.fromEntries(EQUIP.map(e => [e.id, e]));
  const rng = x => x.min === x.max ? `${x.min}` : `${x.min}–${x.max}`;
  const t = el("table", { class: "list" });
  t.append(el("tr", {}, ...["Babak", "Equipment biasa", "Crystal sinergi", "Kapasitas +1", "Hero", "Harga hero: peluang (bobot)"]
    .map(h => el("th", {}, h))));
  BOX.rounds.forEach(r => t.append(el("tr", {},
    el("td", { class: "num" }, el("b", {}, r.label), el("span", { class: "muted" }, ` babak ${r.round}`)),
    el("td", { class: "num" }, rng(r.equipment)), el("td", { class: "num" }, rng(r.crystals)),
    el("td", { class: "num" }, r.special.count), el("td", { class: "num" }, r.heroes.count),
    el("td", {}, r.heroes.costs.map(c => `${c.cost} Gold ${c.chance}% (${c.weight})`).join(" · ") || "-"))));
  // rounds sharing the same pool are shown once; the grey text is what the orb shows in-game (item summary)
  const pools = [["equipment", "Pool equipment biasa"], ["crystals", "Pool crystal sinergi"], ["special", "Item pengisi"]].flatMap(([key, title]) => {
    const groups = new Map();
    BOX.rounds.forEach(r => {
      if (!r[key].pool.length) return;
      const k = JSON.stringify(r[key].pool.map(p => [p.id, p.weight]));
      if (!groups.has(k)) groups.set(k, { pool: r[key].pool, rounds: [] });
      groups.get(k).rounds.push(r.label);
    });
    return [...groups.values()].map(g => {
      const same = new Set(g.pool.map(p => p.weight)).size === 1;
      return el("div", { class: "skill" }, el("b", {}, `${title} (${g.rounds.join(", ")}) · ${g.pool.length} item${same ? ", peluang sama" : ""}`),
        el("div", { class: "pills" }, ...g.pool.map(p => el("span", { class: "chip static", title: p.summary || p.name },
          img((EQ_BY_ID[p.id] || {}).icon, "xs"), p.name, p.summary ? el("span", { class: "muted" }, ` · ${p.summary}`) : "",
          p.missing ? el("span", { class: "muted" }, " · tidak ada di tabel equipment") : "",
          same ? "" : el("span", { class: "muted" }, ` [${p.weight}]`)))));
    });
  });
  const extra = BOX.rounds.filter(r => r.extra).map(r => el("div", { class: "datanote" },
    `Kolom lain babak ${r.label}: ` + Object.entries(r.extra).map(([k, v]) => `${k} = ${JSON.stringify(v)}`).join(", ")))
    .concat((BOX.notes || []).map(n => el("div", { class: "datanote" }, "Catatan data: " + n)));
  infoBox.append(el("h2", {}, "Go Go Box"),
    el("p", { class: "muted" }, "Babak Go Go Box ada di akhir tiap fase. Player memilih 1 hadiah berurutan dari sisa HP Commander terendah. " +
      `Tiap Go Go Box berisi ${BOX.orbs} orb + hero: equipment biasa, crystal sinergi acak sampai total equipment babak itu, sisanya ` +
      `Kapasitas +1 (jumlah ${BOX.orbs} orb dari pengamatan in-game). Harga tiap hero diundi dengan bobot di tabel; bobot harga yang ` +
      `sama dijumlahkan. Teks abu-abu = tulisan di orb in-game. Sumber: MCRoundRandomEquip_S${D.season}.`),
    el("div", { class: "card stats-wrap" }, t, ...extra), el("div", { class: "card" }, ...pools));
}

// server patch summary (server_patch.json)
const SERVER = D.server_patches || [];
document.querySelector('button.tab[data-tab="server"]').classList.toggle("hidden", !SERVER.length);
const serverBox = document.getElementById("server");
SERVER.forEach(p => {
  const t = el("table", { class: "list" });
  t.append(el("tr", {}, ...["Bagian", "Item", "Perubahan", "Status"].map(h => el("th", {}, h))));
  p.changes.forEach(c => t.append(el("tr", {}, el("td", {}, c.kind), el("td", {}, c.target),
    el("td", { class: "srv" }, c.text), el("td", {}, c.status))));
  serverBox.append(el("h2", {}, `Patch ${p.patch} (server)`),
    el("p", { class: "muted" }, `Diumumkan di Patch Note in-game tapi diterapkan server, tidak ada di file game. Sumber: ${p.source}. ` +
      "Nilai hero di tab Hero sudah memakai angka ini (oranye); deskripsi kartu, skill hero & skill commander juga sudah diperbarui. " +
      "Perubahan yang angkanya tidak ada di teks file game tampil sebagai catatan oranye di item tersebut."),
    el("div", { class: "card stats-wrap" }, t),
    ...(p.notes || []).map(n => el("div", { class: "srvnote" }, n)));
});

// ensiklopedia (one in-game tab at a time)
const BOOK = D.encyclopedia || [];
document.querySelector('button.tab[data-tab="book"]').classList.toggle("hidden", !BOOK.length);
function tableBlock(t) {
  const n = el("table", { class: "stats" });
  n.append(el("tr", {}, ...t.header.map(h => el("th", {}, h))));
  t.rows.forEach(r => n.append(el("tr", {}, ...r.map(x => el("td", {}, x)))));
  return el("div", { class: "stats-wrap" }, n);
}
function renderBook(name) {
  const tab = BOOK.find(t => t.name === name) || BOOK[0];
  document.getElementById("book-body").replaceChildren(el("h2", {}, tab.name), el("div", { class: "grid" },
    ...tab.sections.map(s => el("article", { class: "card" },
      s.title ? el("h3", {}, s.title) : "", s.text ? el("div", { class: "desc" }, s.text) : "",
      s.table ? tableBlock(s.table) : "", s.note ? el("div", { class: "desc muted" }, s.note) : ""))));
}
if (BOOK.length) {
  const box = document.getElementById("book-tabs");
  BOOK.forEach((t, i) => {
    const chip = el("button", { class: "chip", "aria-pressed": String(i === 0) }, t.name);
    chip.onclick = () => {
      box.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === chip));
      renderBook(t.name);
    };
    box.append(chip, " ");
  });
  renderBook(BOOK[0].name);
}
</script>
</body>
</html>
